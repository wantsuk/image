    <style>
        /* 깔끔한 고딕체 폰트 설정 및 청량한 파스텔 스카이 배경 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #eef7ff;
            padding: 20px;
            color: #333;
            line-height: 1.5;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 15px;
            border: 3px solid #90caf9;
            box-shadow: 0 4px 15px rgba(25, 118, 210, 0.08);
        }

        h2 {
            text-align: center;
            color: #1976d2;
            margin-bottom: 20px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        /* 검색창: 군더더기 없이 깔끔하게 */
        #search {
            width: 100%;
            padding: 12px 20px;
            font-size: 16px;
            border: 2px solid #e3f2fd;
            border-radius: 10px;
            box-sizing: border-box;
            margin-bottom: 20px;
            outline: none;
            transition: 0.2s;
        }

        #search:focus {
            border-color: #64b5f6;
            background-color: #f3f9ff;
        }

        /* 리스트 영역 */
        #result-list {
            height: 650px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .song-item {
            padding: 10px;
            border-bottom: 1px solid #e3f2fd;
            font-size: 15px;
            display: flex;
            align-items: center;
        }

        .song-item:hover {
            background-color: #f3f9ff;
        }

        /* 번호와 제목 구분 */
        .song-num {
            font-weight: 700;
            color: #1976d2;
            width: 55px;
            flex-shrink: 0;
            font-size: 14px;
        }

        .song-title {
            font-weight: 500;
            color: #444;
        }

        /* 스크롤바 디자인 */
        #result-list::-webkit-scrollbar {
            width: 5px;
        }

        #result-list::-webkit-scrollbar-thumb {
            background: #64b5f6;
            border-radius: 10px;
        }

        /* 실제 화면에서는 원본 텍스트 영역 숨김 */
        #raw-list {
            display: none;
        }
    </style>
</head>

<div class="container">
    <h2>💎 냥냥수주 숲시그 리스트 💎</h2>
    <input type="text" id="search" onkeyup="doSearch()" placeholder="검색어를 입력하세요 (번호나 제목)" autofocus>
    <div id="result-list"></div>

<script>
    function parseRawList() {
        const rawText = document.getElementById("raw-list").value;
        const lines = rawText.split(/\r?\n/);
        const parsed = [];

        lines.forEach(line => {
            const trimmed = line.trim();
            if (!trimmed) return;

            // 앞부분의 숫자/번호와 뒤의 제목을 분리 (예: "100 제목" 또는 "100 - 제목" 또는 "100: 제목")
            const match = trimmed.match(/^([A-Za-z0-9_-]+)\s*[-:|.]?\s*(.*)$/);
            if (match && match[2]) {
                parsed.push({
                    num: match[1],
                    title: match[2].trim()
                });
            } else {
                parsed.push({
                    num: "-",
                    title: trimmed
                });
            }
        });

        return parsed;
    }

    const sigList = parseRawList();

    function renderList(items) {
        const resultList = document.getElementById("result-list");
        resultList.innerHTML = "";

        if (items.length === 0) {
            resultList.innerHTML = '<div class="song-item"><span class="song-title">검색 결과가 없습니다.</span></div>';
            return;
        }

        items.forEach(item => {
            const row = document.createElement("div");
            row.className = "song-item";
            row.innerHTML = `<span class="song-num">${item.num}</span><span class="song-title">${item.title}</span>`;
            resultList.appendChild(row);
        });
    }

    function doSearch() {
        const query = document.getElementById("search").value.trim().toLowerCase();
        if (!query) {
            renderList(sigList);
            return;
        }

        const filtered = sigList.filter(item =>
            String(item.num).toLowerCase().includes(query) ||
            String(item.title).toLowerCase().includes(query)
        );
        renderList(filtered);
    }

    renderList(sigList);
</script>
